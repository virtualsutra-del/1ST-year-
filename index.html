<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Journey</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background-color: #fce7f3;
        }
        h1,h2,.romantic-font { font-family: 'Dancing Script', cursive; }

        .heart {
            position: absolute;
            bottom: -50px;
            color: #ec4899;
            animation: floatUp linear forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            to { transform: translateY(-120vh) scale(1.5); opacity: 0; }
        }

        .fade-in { animation: fadeIn 1.5s forwards; }
        .fade-out { animation: fadeOut 1.5s forwards; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        @keyframes fadeOut { from{opacity:1} to{opacity:0} }

        .slide-up { animation: slideUp 2s forwards; }
        @keyframes slideUp {
            from{transform:translateY(50px);opacity:0}
            to{transform:translateY(0);opacity:1}
        }

        .burst { animation: burst 0.3s forwards; }
        @keyframes burst {
            to { transform: scale(0); opacity: 0; }
        }
    </style>
</head>

<body class="relative h-screen text-pink-900">

<!-- Floating hearts -->
<div id="hearts-container" class="absolute inset-0"></div>

<!-- ================= INTRO ================= -->
<div id="scene-intro" class="absolute inset-0 flex items-center justify-center">
    <div id="cat1" class="hidden text-center">
        <img src="cats/cat1.jpg" class="w-64 rounded-full mx-auto">
        <h2 class="text-5xl mt-4">IS IT MORNING ALREADY ???</h2>
    </div>

    <div id="cat2" class="hidden text-center">
        <img src="cats/cat2.jpg" class="w-64 rounded-full mx-auto">
        <h2 class="text-5xl mt-4">OHOO !! IT'S YOUR BEAUTY THAT TURNED NIGHT INTO MORNING</h2>
    </div>

    <div id="cat3" class="hidden text-center">
        <img src="cats/cat3.jpg" class="w-64 rounded-full mx-auto">
        <h2 class="text-5xl mt-4">COME I WILL LEAD YOU AHEAD</h2>
    </div>
</div>

<!-- ================= BALLOONS ================= -->
<div id="scene-balloons" class="hidden absolute inset-0 bg-pink-100 flex flex-col items-center">
    <h1 class="text-7xl mt-10 slide-up">THE GARDEN OF BALLOONS</h1>

    <div class="flex gap-8 mt-20">
        <img src="balloons/b1.png" id="b1" onclick="burst(1)" class="w-40 cursor-pointer">
        <img src="balloons/b2.png" id="b2" onclick="burst(2)" class="w-40 cursor-pointer">
        <img src="balloons/b3.png" id="b3" onclick="burst(3)" class="w-40 cursor-pointer">
        <img src="balloons/b4.png" id="b4" onclick="burst(4)" class="w-40 cursor-pointer">
    </div>

    <button id="nextBtn" onclick="goLetters()" class="hidden mt-16 px-8 py-3 bg-pink-600 text-white rounded-full">
        NEXT DESTINATION
    </button>
</div>

<!-- ================= LETTERS ================= -->
<div id="scene-letters" class="hidden absolute inset-0 bg-pink-50 overflow-y-auto">
    <h1 class="text-7xl text-center mt-8 slide-up">THE GARDEN OF LETTERS</h1>

    <div class="grid grid-cols-3 gap-8 mt-16 px-16">
        <img src="mailboxes/m.png" onclick="openLetter(1)" class="cursor-pointer">
        <img src="mailboxes/m.png" onclick="openLetter(2)" class="cursor-pointer">
        <img src="mailboxes/m.png" onclick="openLetter(3)" class="cursor-pointer">
        <img src="mailboxes/m.png" onclick="openLetter(4)" class="cursor-pointer">
        <img src="mailboxes/m.png" onclick="openLetter(5)" class="cursor-pointer">
        <img src="mailboxes/m.png" onclick="openLetter(6)" class="cursor-pointer">
        <img src="mailboxes/m.png" onclick="openLetter(7)" class="cursor-pointer">
        <img src="mailboxes/m.png" onclick="openLetter(8)" class="cursor-pointer">
        <img src="mailboxes/m.png" onclick="openLetter(9)" class="cursor-pointer">
    </div>
</div>

<!-- ================= MODAL ================= -->
<div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center">
    <img id="modalImg" class="max-h-[90vh] rounded-xl">
    <button onclick="closeModal()" class="absolute top-6 right-6 text-white text-3xl">✕</button>
</div>

<script>
/* hearts */
setInterval(()=>{
    let h=document.createElement('div');
    h.className='heart';
    h.innerHTML='❤';
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=Math.random()*20+10+'px';
    h.style.animationDuration=Math.random()*3+4+'s';
    document.getElementById('hearts-container').appendChild(h);
    setTimeout(()=>h.remove(),7000);
},500);

/* intro */
const wait = ms => new Promise(r=>setTimeout(r,ms));
async function intro(){
    for(let i=1;i<=3;i++){
        let el=document.getElementById('cat'+i);
        el.classList.remove('hidden'); el.classList.add('fade-in');
        await wait(5000);
        el.classList.add('fade-out');
        await wait(1500);
        el.classList.add('hidden');
    }
    document.getElementById('scene-intro').classList.add('hidden');
    document.getElementById('scene-balloons').classList.remove('hidden');
}
window.onload=intro;

/* balloons */
let popped=0;
function burst(n){
    let b=document.getElementById('b'+n);
    if(b.classList.contains('burst')) return;
    b.classList.add('burst');
    openModal(`photos/p${n}.jpg`);
    popped++;
    if(popped===4) document.getElementById('nextBtn').classList.remove('hidden');
}

function goLetters(){
    document.getElementById('scene-balloons').classList.add('hidden');
    document.getElementById('scene-letters').classList.remove('hidden');
}

/* letters */
function openLetter(n){
    openModal(`letters/l${n}.jpg`);
}

/* modal */
function openModal(src){
    document.getElementById('modalImg').src=src;
    document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){
    document.getElementById('modal').classList.add('hidden');
}
</script>

</body>
</html>
